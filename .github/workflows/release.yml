name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CONTRIBUTING.md: pull request, CI green, merge, tag. A tag cut on a side
      # branch would publish a commit CI never evaluated.
      - name: Require the tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      - name: Build linux binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/sysclet-linux-$arch" .
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w" \
              -o "dist/sysclet-installer-linux-$arch" ./cmd/installer
          done
          (cd dist && sha256sum sysclet-linux-* sysclet-installer-linux-* > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --latest --generate-notes --title "sysclet $tag"
          fi
